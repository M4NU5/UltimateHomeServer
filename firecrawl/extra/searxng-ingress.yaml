# Browser access to SearXNG at https://searxng.bongofett.com: home LAN, plus Tailscale clients
# (Windows/phones reach 192.168.1.5 over the tailnet subnet route, so Traefik sees their 100.x IP).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: searxng-allow-lan
  namespace: firecrawl
spec:
  ipAllowList:
    sourceRange:
      - 192.168.1.0/24
      - 100.64.0.0/10
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: searxng
  namespace: firecrawl
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`searxng.bongofett.com`)
      services:
        - kind: Service
          name: searxng
          port: 8080
      middlewares:
        - name: searxng-allow-lan
  tls:
    secretName: bongofett-cert
