# SearXNG: metasearch backend for Firecrawl /search (SEARXNG_ENDPOINT in firecrawl/values.yaml).
# Without it Firecrawl scrapes DuckDuckGo directly, which blocks it as a bot.
# SearXNG spreads each query over several engines, so one engine blocking us still returns results.
# Browser page: https://searxng.bongofett.com (searxng-ingress.yaml, home LAN only).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: searxng-secret
  namespace: firecrawl
spec:
  encryptedData:
    SEARXNG_SECRET: 
  template:
    metadata:
      name: searxng-secret
      namespace: firecrawl
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-settings
  namespace: firecrawl
data:
  # Mounted as the whole /etc/searxng directory (no subPath), so edits reach the pod without a rebuild.
  # Engines tested from the home IP on 2026-11-22: bing, brave and google cse answer; google,
  # qwant and wikidata are denied and duckduckgo CAPTCHAs, so those are off.
  settings.yml: |
    use_default_settings:
      engines:
        remove:
          - wikidata
    general:
      instance_name: SearXNG
    server:
      base_url: https://searxng.bongofett.com/
      limiter: false          # LAN-only behind an allowlist; the limiter would also need valkey
      public_instance: false
      image_proxy: true       # the browser loads result images via SearXNG, not from third parties
      method: GET
    search:
      safe_search: 0
      autocomplete: brave     # default is duckduckgo, which CAPTCHAs us
      formats:
        - html
        - json                # Firecrawl calls /search?format=json
    outgoing:
      request_timeout: 6.0
      max_request_timeout: 15.0
    engines:
      - name: duckduckgo
        disabled: true
      - name: bing
        disabled: false
      - name: brave
        disabled: false
  # Read even with the limiter off: lets SearXNG trust Traefik's X-Forwarded-For (pod CIDR 10.42.0.0/16).
  limiter.toml: |
    [botdetection]
    ipv4_prefix = 32
    ipv6_prefix = 48
    trusted_proxies = ['127.0.0.0/8', '::1', '10.42.0.0/16']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: firecrawl
  labels:
    app: searxng
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
      annotations:
        # SearXNG reads its config only at start. Bump this when searxng-settings changes.
        searxng/config-rev: "2"
    spec:
      containers:
        - name: searxng
          image: searxng/searxng:2026.11.6-ac11e14c5
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: FORCE_OWNERSHIP   # config is a read-only ConfigMap; skip the entrypoint's chown
              value: "false"
          envFrom:
            - secretRef:
                name: searxng-secret
          volumeMounts:
            - name: settings
              mountPath: /etc/searxng
              readOnly: true
            - name: cache
              mountPath: /var/cache/searxng
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: settings
          configMap:
            name: searxng-settings
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: searxng
  namespace: firecrawl
spec:
  selector:
    app: searxng
  ports:
    - name: http
      port: 8080
      targetPort: http
