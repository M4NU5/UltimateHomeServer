common:
    namespace: home-server
    tz: Europe/London
    network:
        gateway: 192.168.0.1

certManager:
    namespace: cert-manager
    installCRDs: true
    clusterIssuer:
        enabled: true
        name: letsencrypt-cluster-issuer
        server: https://acme-staging-v02.api.letsencrypt.org/directory
        # server: https://acme-v02.api.letsencrypt.org/directory
        secretName: letsencrypt-cluster-issuer
        ingressClass: traefik
        # email loaded from sealed secret: cert-manager-email

storage:
    smb:
        pvcClaimName: pvc-smb
        pvName: pv-smb
        smbAddress: //192.168.0.2/NASty
        # smbAddress loaded from sealed secret: smb-address
    seedbox:
        hostPath: /mnt/seedbox    # simple host path, no PVC

services:
    traefik:
        domain: bongofett.com
        namespace: home-server
        ports:
            http: 80
            https: 443

    homepage:
        enabled: true
        namespace: home-server
        replicaCount: 1
        image:
            repository: ghcr.io/benphelps/homepage
            tag: latest
            pullPolicy: Always
        ports:
            http: 3000
        # API keys for the service widgets below are injected as env vars
        # from an OPTIONAL secret named `homepage-secrets` (see deployment.yaml).
        # Until it exists the tiles still render with a live up/down dot (ping);
        # the stat widgets light up once the HOMEPAGE_VAR_* keys are provided.
        # NOTE ON SHAPE (https://gethomepage.dev/configs/): bookmarks and services
        # nest differently, and getting it wrong silently drops every property.
        #   bookmarks -> group -> name -> a LIST holding ONE map (abbr/href/icon together)
        #   services  -> group -> name -> a MAP directly (icon/href/ping/widget as keys)
        # The old "- icon:" / "- href:" style made homepage parse each property as a
        # separate list entry, so it only ever saw the name: bare, unlinked tiles.
        bookmarks:
            - Development:
                - GitHub:
                    - abbr: GH
                      href: https://github.com/M4NU5/UltimateHomeServer
                      icon: mdi-github
                - ArgoCD:
                    - abbr: CD
                      href: https://argocd.bongofett.com
                      icon: argocd
            - Media:
                - YouTube:
                    - abbr: YT
                      href: https://youtube.com
                      icon: mdi-youtube
            - Quick Links:
                - Router:
                    - abbr: RT
                      href: http://192.168.0.1
                - NAS:
                    - abbr: NAS
                      href: http://192.168.0.2
        services:
            - Media:
                - Jellyfin:
                    icon: jellyfin
                    href: https://jellyfin.bongofett.com
                    description: Movies & TV streaming
                    ping: http://jellyfin.home-server.svc.cluster.local:8096
                    widget:
                        type: jellyfin
                        url: http://jellyfin.home-server.svc.cluster.local:8096
                        key: "{{HOMEPAGE_VAR_JELLYFIN_API_KEY}}"
                        enableBlocks: true
                        enableNowPlaying: true
                - Tdarr:
                    icon: tdarr
                    href: https://tdarr.bongofett.com
                    description: Transcode automation
                    ping: http://tdarr.home-server.svc.cluster.local:8265
                    widget:
                        type: tdarr
                        url: http://tdarr.home-server.svc.cluster.local:8265
            - Automation:
                - Sonarr:
                    icon: sonarr
                    href: https://sonarr.bongofett.com
                    description: TV series
                    ping: http://sonarr.home-server.svc.cluster.local:8989
                    widget:
                        type: sonarr
                        url: http://sonarr.home-server.svc.cluster.local:8989
                        key: "{{HOMEPAGE_VAR_SONARR_API_KEY}}"
                - Radarr:
                    icon: radarr
                    href: https://radarr.bongofett.com
                    description: Movies
                    ping: http://radarr.home-server.svc.cluster.local:7878
                    widget:
                        type: radarr
                        url: http://radarr.home-server.svc.cluster.local:7878
                        key: "{{HOMEPAGE_VAR_RADARR_API_KEY}}"
                - Prowlarr:
                    icon: prowlarr
                    href: https://prowlarr.bongofett.com
                    description: Indexer manager
                    ping: http://prowlarr.home-server.svc.cluster.local:9696
                    widget:
                        type: prowlarr
                        url: http://prowlarr.home-server.svc.cluster.local:9696
                        key: "{{HOMEPAGE_VAR_PROWLARR_API_KEY}}"
                - Bazarr:
                    icon: bazarr
                    href: https://bazarr.bongofett.com
                    description: Subtitles
                    ping: http://bazarr.home-server.svc.cluster.local:6767
                    widget:
                        type: bazarr
                        url: http://bazarr.home-server.svc.cluster.local:6767
                        key: "{{HOMEPAGE_VAR_BAZARR_API_KEY}}"
            - Infrastructure:
                - ArgoCD:
                    icon: argocd
                    href: https://argocd.bongofett.com
                    description: GitOps deployments
                - Firecrawl:
                    icon: mdi-fire
                    href: https://firecrawl.bongofett.com
                    description: Web scraping API
                    ping: http://firecrawl-firecrawl-api.firecrawl.svc.cluster.local:3002
        widgets:
            - greeting:
                text_size: xl
                text: Bongofett Home Server
            - kubernetes:
                cluster:
                    show: true
                    cpu: true
                    memory: true
                    showLabel: true
                    label: cluster
                nodes:
                    show: true
                    cpu: true
                    memory: true
                    showLabel: true
            - search:
                provider: google
                focus: true
                target: _blank
            - datetime:
                text_size: xl
                format:
                    timeStyle: short
                    dateStyle: long
        settings:
            title: Bongofett Home Server
            theme: dark
            color: slate
            headerStyle: boxed
            statusStyle: dot
            hideVersion: true
            layout:
                Media:
                    style: row
                    columns: 2
                Automation:
                    style: row
                    columns: 4
                Infrastructure:
                    style: row
                    columns: 2

    jellyfin:
        enabled: true
        replicaCount: 1
        image:
            repository: lscr.io/linuxserver/jellyfin
            tag: latest
            pullPolicy: Always
        ports:
            http: 8096
            udp: 7359
        config: /var/lib/k3s/config/jellyfin
        library: data/library

    prowlarr:
        enabled: true
        replicaCount: 1
        image:
            repository: lscr.io/linuxserver/prowlarr
            tag: latest
            pullPolicy: Always
        ports:
            http: 9696
        config: /var/lib/k3s/config/prowlarr

    radarr:
        enabled: true
        replicaCount: 1
        image:
            repository: lscr.io/linuxserver/radarr
            tag: latest
            pullPolicy: Always
        ports:
            http: 7878
        config: /var/lib/k3s/config/radarr
        data: /data
        seedbox: /seedbox

    sonarr:
        enabled: true
        replicaCount: 1
        image:
            repository: lscr.io/linuxserver/sonarr
            tag: latest
            pullPolicy: Always
        ports:
            http: 8989
        config: /var/lib/k3s/config/sonarr
        data: /data
        seedbox: /seedbox

    bazarr:
        enabled: true
        replicaCount: 1
        image:
            repository: lscr.io/linuxserver/bazarr
            tag: latest
            pullPolicy: Always
        ports:
            http: 6767
        config: /var/lib/k3s/config/bazarr
        data: /data

    changedetectionio:
        enabled: false
        replicaCount: 1
        image:
            repository: ghcr.io/dgtlmoon/changedetection.io
            tag: latest@sha256:736331d2787f94d3201b64aa641e090f67e28577ba505bd7ba5d7c1841e1e0ca
            pullPolicy: IfNotPresent
        ports:
            http: 5000
        config: /var/lib/k3s/config/changedetectionio

    playwright:
        enabled: true
        replicaCount: 1
        image:
            repository: browserless/chrome
            tag: latest
            pullPolicy: Always
        ports:
            http: 3000
        config: /opt/playwright/config

    tdarr:
        enabled: true
        replicaCount: 1
        image:
            repository: haveagitgat/tdarr
            tag: latest
            pullPolicy: Always
        ports:
            http: 8265
            server: 8266
        config: /var/lib/k3s/config/tdarr
        cache: /var/lib/k3s/cache/tdarr
        data: /media
        ffmpegVersion: "7"
        nodeName: InternalNode

    qbittorrent:
        enabled: false
        replicaCount: 1
        image:
            repository: lscr.io/linuxserver/qbittorrent
            tag: latest
            pullPolicy: Always
        ports:
            http: 8080
            p2p: 6881
            p2pudp: 6881
        config: /var/lib/k3s/config/qbittorrent
        data: /seedbox

    ## Disabled services
    caido:
        enabled: false
    overseerr:
        enabled: false
    tautulli:
        enabled: false
    thelounge:
        enabled: false
    cloudflared:
        enabled: false
    autobrr:
        enabled: false
    unpackerr:
        enabled: false
    huginn:
        enabled: false
    gotify:
        enabled: false
    sabnzbd:
        enabled: false
    kavita:
        enabled: false
    apprise:
        enabled: false
    plex:
        enabled: false