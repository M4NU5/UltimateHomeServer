{{- if .Values.services.immich.enabled }}
{{- $vk := .Values.services.immich.valkey }}
# Job queue only. Nothing here needs to survive a restart, so no volume.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-valkey
  namespace: {{ .Values.common.namespace }}
  labels:
    app.kubernetes.io/name: immich-valkey
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-valkey
    spec:
      enableServiceLinks: false
      containers:
        - name: valkey
          image: "{{ $vk.repository }}:{{ $vk.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli ping | grep -q PONG"]
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: immich-valkey
  namespace: {{ .Values.common.namespace }}
  labels:
    app.kubernetes.io/name: immich-valkey
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
  selector:
    app.kubernetes.io/name: immich-valkey
{{- end }}
